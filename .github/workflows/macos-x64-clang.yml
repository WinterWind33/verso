name: MacOS x64 Clang Build

on:
  push:
    branches-ignore:
      - main

jobs:
  build-and-test:
    runs-on: macos-latest
    strategy:
      matrix:
        build-type: [Release, Debug]
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -B build -DVERSO_BUILD_TESTS=ON -DVERSO_BUILD_EXAMPLES=ON -DCMAKE_BUILD_TYPE=${{ matrix['build-type'] }}

      - name: Build all targets
        run: cmake --build build --config ${{ matrix['build-type'] }} -- -j$(sysctl -n hw.ncpu)

      - name: Run tests
        run: |
          ./build/tests/verso-tests -S
